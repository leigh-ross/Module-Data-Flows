<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Movie display" />
    <title>Film View</title>
  </head>
  <body>
    <main>
      <label>
        Search
        <input type="search" id="q" name="q" placeholder="Search term" /> 🔍
      </label>

      <template id="film-card">
        <section>
          <h3>Film title</h3>
          <p data-director>Director</p>
          <time>Duration</time>
          <data data-certificate>Certificate</data>
        </section>
      </template>

      <script src="script.js"></script>
    </main>
  </body>
</html>
